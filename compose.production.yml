services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: visa-app:latest
    env_file:
      - /home/visa/shared/.env.production
    volumes:
      - /home/visa/shared/storage:/app/storage
      - /home/visa/shared/log:/app/log
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - db
      - redis
    command: bash -lc "mkdir -p tmp/pids tmp/cache tmp/sockets && bundle exec puma -C config/puma.rb"

  # Фоновые задачи по расписанию (ежедневная сводка по заявкам и т.п.).
  # Тот же образ, что у web; см. app/services/scheduler.rb.
  scheduler:
    image: visa-app:latest
    env_file:
      - /home/visa/shared/.env.production
    volumes:
      - /home/visa/shared/log:/app/log
    depends_on:
      - db
      - redis
    restart: unless-stopped
    command: bash -lc "bundle exec bin/scheduler"

  db:
    image: postgres:15
    env_file:
      - /home/visa/shared/.env.production
    volumes:
      - /home/visa/shared/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    volumes:
      - /home/visa/shared/redis:/data