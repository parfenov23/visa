upstream myapp {
  server 127.0.0.1:3000;
  keepalive 64;
}

server {
  # Только HTTPS. HTTP (порт 80) обрабатывается отдельным server-блоком ниже,
  # который делает 301-редирект на https. Раньше здесь был ещё `listen 80;`,
  # из-за чего этот блок перехватывал HTTP-трафик и редирект не срабатывал.
  server_name russvisa.com www.russvisa.com;

  client_max_body_size 50M;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;

  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  location / {
    proxy_pass http://myapp;
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
  }

  location ~ ^/(assets|packs|fonts|images|favicon.ico|robots.txt) {
    proxy_pass http://myapp;
    expires max;
    add_header Cache-Control public;
  }

  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/russvisa.com/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/russvisa.com/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# QR-домен верификации (fortunatravel.in). Проксирует в то же приложение;
# Rails по Host-заголовку отдаёт только /verify/:token, остальное — 404
# (см. VERIFY_DOMAIN в config/routes.rb). Сертификат и 80→443 редирект
# настроены certbot-ом (2026-08-05), блоки перенесены сюда с сервера.
server {
  server_name fortunatravel.in www.fortunatravel.in;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;

  location / {
    proxy_pass http://myapp;
    proxy_read_timeout 60;
    proxy_connect_timeout 60;
  }

  location ~ ^/(assets|packs|fonts|images|favicon.ico|robots.txt) {
    proxy_pass http://myapp;
    expires max;
    add_header Cache-Control public;
  }

  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/fortunatravel.in/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/fortunatravel.in/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
  if ($host = www.fortunatravel.in) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  if ($host = fortunatravel.in) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  listen 80;
  server_name fortunatravel.in www.fortunatravel.in;
  return 404; # managed by Certbot
}

server {
  if ($host = www.russvisa.com) {
    return 301 https://$host$request_uri;
  } # managed by Certbot


  if ($host = russvisa.com) {
    return 301 https://$host$request_uri;
  } # managed by Certbot


  listen 80;
  server_name russvisa.com www.russvisa.com;
  return 404; # managed by Certbot
}